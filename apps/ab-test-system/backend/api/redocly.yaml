extends:
  - recommended

apis:
  base:
    root: ./base.yml
  user:
    root: ./user.yml
  projects:
    root: ./projects.yml
  api_keys:
    root: ./api_keys.yml
  flags:
    root: ./flags.yml
  experiments:
    root: ./experiments.yml
  analytics:
    root: ./analytics.yml

rules:
  # Critical errors only
  no-unresolved-refs: error
  operation-operationId-unique: error
  no-identical-paths: error
  
  # Disable pedantic warnings for dev
  info-license: off
  no-server-example.com: off
  no-unused-components: off
  operation-4xx-response: off
  security-defined: off
  
decorators:
  remove-x-internal: off
