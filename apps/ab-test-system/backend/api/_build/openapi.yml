openapi: 3.0.3
info:
  title: AB Test Platform API
  description: |
    API for Feature Flags and A/B Testing Platform

    This platform provides:
    - Feature flags with targeting and gradual rollout
    - A/B/n experiments with deterministic user assignment
    - Event collection (exposure/conversion)
    - Statistical analysis and uplift calculation
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
servers:
  - url: http://localhost:8080/api/v1
    description: Development server
tags:
  - name: users
    description: User management
    x-displayName: users
  - name: projects
    x-displayName: projects
  - name: api-keys
    x-displayName: api-keys
  - name: flags
    x-displayName: flags
  - name: experiments
    x-displayName: experiments
paths:
  /users:
    post:
      tags:
        - users
      summary: Complete user registration
      description: Creates user profile
      operationId: CreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me:
    get:
      tags:
        - users
      summary: Get current user profile
      description: Returns the authenticated user's profile information
      operationId: GetCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects:
    post:
      tags:
        - projects
      summary: Create a project
      operationId: CreateProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - projects
      summary: List projects for the current organization
      operationId: ListProjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    get:
      tags:
        - projects
      summary: Get a project by ID
      operationId: GetProject
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - projects
      summary: Update a project
      operationId: UpdateProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - projects
      summary: Delete a project
      operationId: DeleteProject
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Project deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/api-keys:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      tags:
        - api-keys
      summary: Create an API key for a project
      operationId: CreateApiKey
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created — raw key returned only here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
        - api-keys
      summary: List API keys for a project
      operationId: ListApiKeys
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of API keys (raw key never returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/api-keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - api-keys
      summary: Revoke an API key
      operationId: RevokeApiKey
      security:
        - BearerAuth: []
      responses:
        '204':
          description: API key revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/flags:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      tags:
        - flags
      summary: Create a feature flag
      operationId: CreateFlag
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFlagRequest'
      responses:
        '201':
          description: Flag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
        - flags
      summary: List feature flags for a project
      operationId: ListFlags
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/flags/{flagKey}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - name: flagKey
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - flags
      summary: Get a feature flag by key
      operationId: GetFlag
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Flag found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - flags
      summary: Update a feature flag
      operationId: UpdateFlag
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFlagRequest'
      responses:
        '200':
          description: Flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - flags
      summary: Delete a feature flag
      operationId: DeleteFlag
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Flag deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/experiments:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
    post:
      tags:
        - experiments
      summary: Create an experiment
      operationId: CreateExperiment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperimentRequest'
      responses:
        '201':
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
        - experiments
      summary: List experiments for a project
      operationId: ListExperiments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{projectId}/experiments/{experimentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ExperimentIdParam'
    get:
      tags:
        - experiments
      summary: Get an experiment by ID
      operationId: GetExperiment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Experiment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - experiments
      summary: Update experiment metadata (draft only)
      operationId: UpdateExperiment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExperimentRequest'
      responses:
        '200':
          description: Experiment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - experiments
      summary: Delete an experiment (draft only)
      operationId: DeleteExperiment
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Experiment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/experiments/{experimentId}/start:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ExperimentIdParam'
    post:
      tags:
        - experiments
      summary: Start an experiment (draft → running)
      operationId: StartExperiment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Experiment started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/experiments/{experimentId}/pause:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ExperimentIdParam'
    post:
      tags:
        - experiments
      summary: Pause a running experiment (running → paused)
      operationId: PauseExperiment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Experiment paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/experiments/{experimentId}/resume:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ExperimentIdParam'
    post:
      tags:
        - experiments
      summary: Resume a paused experiment (paused → running)
      operationId: ResumeExperiment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Experiment resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/experiments/{experimentId}/complete:
    parameters:
      - $ref: '#/components/parameters/ProjectIdParam'
      - $ref: '#/components/parameters/ExperimentIdParam'
    post:
      tags:
        - experiments
      summary: Complete an experiment (running/paused → completed)
      operationId: CompleteExperiment
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Experiment completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth JWT token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: SDK API key for client/server SDKs
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
    User:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        photoURL:
          type: string
          format: uri
          example: https://lh3.googleusercontent.com/a/...
        organizationId:
          type: string
          format: uuid
          example: org-uuid-456
        role:
          type: string
          enum:
            - admin
            - member
            - viewer
          example: member
          description: |
            User role in the organization:
            - admin: Full access, can manage users and billing
            - member: Can create and manage experiments
            - viewer: Read-only access
        createdAt:
          type: string
          format: date-time
          example: '2026-02-15T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-02-15T12:00:00Z'
    Project:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          example: My App
        description:
          type: string
          example: Production feature flags
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
    ApiKey:
      type: object
      required:
        - id
        - projectId
        - name
        - prefix
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
          example: Production
        prefix:
          type: string
          description: First characters of the key for identification
          example: sk_a1b2c3
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required:
            - key
          properties:
            key:
              type: string
              description: Raw API key — shown only once, store it securely
              example: sk_a1b2c3d4e5f6...
    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Production
    FlagRule:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - percentage
          example: percentage
        value:
          type: number
          minimum: 0
          maximum: 100
          example: 50
    Flag:
      type: object
      required:
        - id
        - projectId
        - key
        - name
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        key:
          type: string
          example: checkout-button
        name:
          type: string
          example: Checkout Button
        enabled:
          type: boolean
          example: false
        rules:
          type: array
          items:
            $ref: '#/components/schemas/FlagRule'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateFlagRequest:
      type: object
      required:
        - key
        - name
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          example: checkout-button
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Checkout Button
    UpdateFlagRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
        rules:
          type: array
          items:
            $ref: '#/components/schemas/FlagRule'
    ExperimentStatus:
      type: string
      enum:
        - draft
        - running
        - paused
        - completed
      example: draft
    Variant:
      type: object
      required:
        - id
        - key
        - name
        - weight
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: control
        name:
          type: string
          example: Control
        weight:
          type: integer
          minimum: 1
          maximum: 100
          example: 50
    CreateVariantRequest:
      type: object
      required:
        - key
        - name
        - weight
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 50
          example: control
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Control
        weight:
          type: integer
          minimum: 1
          maximum: 100
          example: 50
    Experiment:
      type: object
      required:
        - id
        - projectId
        - key
        - name
        - status
        - trafficPercent
        - variants
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        flagId:
          type: string
          format: uuid
          nullable: true
        key:
          type: string
          example: checkout-btn-experiment
        name:
          type: string
          example: Checkout button experiment
        description:
          type: string
          example: Testing new checkout button color
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        trafficPercent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 50
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        endedAt:
          type: string
          format: date-time
          nullable: true
    CreateExperimentRequest:
      type: object
      required:
        - key
        - name
        - trafficPercent
        - variants
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
          example: checkout-btn-experiment
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Checkout button experiment
        description:
          type: string
          maxLength: 500
          example: Testing new checkout button color
        flagId:
          type: string
          format: uuid
          description: Optional flag to associate with this experiment
        trafficPercent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 50
        variants:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/CreateVariantRequest'
    UpdateExperimentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        trafficPercent:
          type: number
          format: float
          minimum: 0
          maximum: 100
  parameters:
    ProjectIdParam:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExperimentIdParam:
      name: experimentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
