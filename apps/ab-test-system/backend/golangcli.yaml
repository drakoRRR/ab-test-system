run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

    - revive
    - goimports
    - gofumpt
    - lll
    - misspell

    - gocritic
    - gocyclo
    - funlen

    - gosec
    - bodyclose
    - noctx

linters-settings:
  goimports:
    local-prefixes: github.com/drakoRRR/ab-test-system/apps/ab-test-system/backend

  gofumpt:
    module-path: github.com/drakoRRR/ab-test-system/apps/ab-test-system/backend

  lll:
    line-length: 120

  funlen:
    lines: 100

  gocyclo:
    min-complexity: 15

  gosec:
    excludes:
      - G104

issues:
  exclude-dirs:
    - bin
    - vendor
    - var
    - tmp
    - internal/handler/http/api/codegen

  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - gocyclo
        - gosec

    # SQL strings in const blocks are intentionally long
    - source: "^\t+`"
      linters:
        - lll