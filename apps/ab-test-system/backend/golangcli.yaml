version: "2"

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    - revive
    - lll
    - misspell

    - gocritic
    - gocyclo
    - funlen

    - gosec
    - bodyclose
    - noctx

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

    lll:
      line-length: 120

    funlen:
      lines: 100

    gocyclo:
      min-complexity: 15

    gosec:
      excludes:
        - G104

formatters:
  enable:
    - goimports
    - gofumpt

  settings:
    goimports:
      local-prefixes:
        - github.com/drakoRRR/ab-test-system/apps/ab-test-system/backend

    gofumpt:
      module-path: github.com/drakoRRR/ab-test-system/apps/ab-test-system/backend

issues:
  exclude-dirs:
    - bin
    - vendor
    - var
    - tmp
    - internal/handler/http/api/codegen
    - ".*mocks$"

  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - gocyclo
        - gosec

    - path: cmd/
      linters:
        - funlen
        - gocritic

    - path: pkg/config/
      linters:
        - gosec

    # SQL strings in const blocks are intentionally long
    - source: "^\t+`"
      linters:
        - lll
