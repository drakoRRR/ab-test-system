version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gofmt
    - govet
    - ineffassign
    - misspell
    - noctx
    - prealloc
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    gocritic:
      disabled-checks:
        - ifElseChain
        - hugeParam

issues:
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
          - gocritic
