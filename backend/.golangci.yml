version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - noctx
    - staticcheck
    - unconvert
    - unused
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
