openapi: 3.0.3
info:
  title: SDK module
  version: 1.0.0

paths:
  /sdk/config:
    get:
      tags: [sdk]
      summary: Fetch project config for local evaluation
      operationId: GetSdkConfig
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Project config snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDKConfig'
        '401':
          $ref: './base.yml#/components/responses/Unauthorized'

  /sdk/events:
    post:
      tags: [sdk]
      summary: Ingest a batch of events
      operationId: PostSdkEvents
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SDKEventBatch'
      responses:
        '202':
          description: Accepted
        '400':
          $ref: './base.yml#/components/responses/BadRequest'
        '401':
          $ref: './base.yml#/components/responses/Unauthorized'

components:
  schemas:
    SDKFlagRule:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [percentage]
        value:
          type: number
          minimum: 0
          maximum: 100

    SDKFlag:
      type: object
      required: [id, key, enabled, rules]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: "checkout-button"
        enabled:
          type: boolean
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SDKFlagRule'

    SDKVariant:
      type: object
      required: [id, key, weight]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: "control"
        weight:
          type: integer

    SDKExperiment:
      type: object
      required: [id, key, trafficPercent, variants]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: "checkout-btn-experiment"
        trafficPercent:
          type: number
          format: float
        variants:
          type: array
          items:
            $ref: '#/components/schemas/SDKVariant'

    SDKConfig:
      type: object
      required: [projectId, flags, experiments]
      properties:
        projectId:
          type: string
          format: uuid
        flags:
          type: array
          items:
            $ref: '#/components/schemas/SDKFlag'
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/SDKExperiment'

    SDKEventType:
      type: string
      enum: [exposure, conversion]

    SDKEvent:
      type: object
      required: [id, userId, experimentId, variantId, type, timestamp]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        experimentId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/SDKEventType'
        name:
          type: string
          description: Event name, required for conversion events
        value:
          type: number
          format: float
          description: Optional numeric value (e.g. revenue)
        timestamp:
          type: string
          format: date-time

    SDKEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/SDKEvent'
          minItems: 1
          maxItems: 1000
