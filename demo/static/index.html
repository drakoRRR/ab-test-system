<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitLab Demo Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 16px; padding: 36px; box-shadow: 0 4px 24px rgba(0,0,0,.08); width: 100%; max-width: 420px; }
    h1 { font-size: 1.4rem; font-weight: 700; }
    .subtitle { color: #999; font-size: 0.85rem; margin-bottom: 24px; margin-top: 2px; }
    .user-row { display: flex; gap: 8px; margin-bottom: 20px; }
    .user-row input { flex: 1; padding: 9px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 0.875rem; outline: none; }
    .user-row input:focus { border-color: #6366f1; }
    .user-row button { padding: 9px 14px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 8px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
    .user-row button:hover { background: #e5e7eb; }
    .product { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 24px; }
    .product-img { font-size: 3rem; line-height: 1; }
    .product-name { font-weight: 600; font-size: 1rem; }
    .price { font-size: 1.6rem; font-weight: 700; margin-top: 2px; }
    .badge { display: inline-block; background: #fef3c7; color: #92400e; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-top: 6px; letter-spacing: .03em; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: .01em; transition: transform .1s, opacity .1s; }
    .btn:active { transform: scale(.98); }
    .btn-control   { background: #3b82f6; color: #fff; }
    .btn-treatment { background: #22c55e; color: #fff; }
    .btn-none      { background: #9ca3af; color: #fff; cursor: default; }
    .meta { font-size: 0.72rem; color: #bbb; text-align: center; margin-top: 10px; }
    .toast { margin-top: 14px; padding: 11px 16px; border-radius: 8px; font-size: 0.875rem; text-align: center; display: none; }
    .toast.ok  { display: block; background: #dcfce7; color: #166534; }
    .toast.err { display: block; background: #fee2e2; color: #991b1b; }
    .outside { text-align: center; color: #aaa; padding: 20px 0; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>
<div class="card">
  <h1>SplitLab Demo Store</h1>
  <p class="subtitle">A/B experiment live demo</p>

  <div class="user-row">
    <input id="uid" type="text" placeholder="user_id" />
    <button onclick="randomUser()">Random</button>
    <button onclick="load()">Load</button>
  </div>

  <div id="product" style="display:none">
    <div class="product">
      <div class="product-img">🛒</div>
      <div>
        <div class="product-name">Premium Plan</div>
        <div class="price">$49 <span style="font-size:.9rem;font-weight:400;color:#999">/ mo</span></div>
        <div id="badge" class="badge" style="display:none"></div>
      </div>
    </div>
    <button id="buyBtn" class="btn" onclick="convert()"></button>
    <div id="meta" class="meta"></div>
    <div id="toast" class="toast"></div>
  </div>

  <div id="outside" class="outside">This user is outside the experiment traffic allocation.</div>
</div>

<script>
  const EXP = new URLSearchParams(location.search).get('experiment_key') || 'checkout-btn'

  function randomUser() {
    document.getElementById('uid').value = 'user-' + Math.random().toString(36).slice(2, 10)
    load()
  }

  async function load() {
    const uid = document.getElementById('uid').value.trim()
    if (!uid) return
    const r = await fetch(`/visit?user_id=${encodeURIComponent(uid)}&experiment_key=${encodeURIComponent(EXP)}`)
    const { variant } = await r.json()
    render(variant, uid)
  }

  function render(variant, uid) {
    const product = document.getElementById('product')
    const outside = document.getElementById('outside')
    const badge   = document.getElementById('badge')
    const btn     = document.getElementById('buyBtn')
    const meta    = document.getElementById('meta')
    const toast   = document.getElementById('toast')
    toast.className = 'toast'

    if (!variant) {
      product.style.display = 'none'
      outside.style.display = 'block'
      return
    }
    product.style.display = 'block'
    outside.style.display = 'none'
    meta.textContent = `variant: ${variant}  ·  user: ${uid}  ·  experiment: ${EXP}`

    if (variant === 'treatment') {
      btn.textContent = 'Get It Now'
      btn.className = 'btn btn-treatment'
      badge.textContent = '🔥 Limited offer'
      badge.style.display = 'inline-block'
    } else {
      btn.textContent = 'Buy Now'
      btn.className = 'btn btn-control'
      badge.style.display = 'none'
    }
  }

  async function convert() {
    const uid = document.getElementById('uid').value.trim()
    if (!uid) return
    const r = await fetch('/convert', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: uid, event: 'purchase', value: 1.0 }),
    })
    const toast = document.getElementById('toast')
    toast.className = r.ok ? 'toast ok' : 'toast err'
    toast.textContent = r.ok ? '✓ Purchase recorded — conversion tracked!' : '✗ Something went wrong'
  }

  window.onload = () => {
    const uid = new URLSearchParams(location.search).get('user_id')
    if (uid) { document.getElementById('uid').value = uid; load() }
    else randomUser()
  }
</script>
</body>
</html>
