name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"

jobs:
  plan:
    name: Plan / ${{ matrix.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]

    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets[format('WIF_PROVIDER_{0}', upper(matrix.environment))] }}
          service_account: ${{ secrets[format('TERRAFORM_SA_{0}', upper(matrix.environment))] }}

      - name: Init
        run: terraform init

      - name: Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true
        env:
          TF_VAR_project_id: ${{ vars[format('GCP_PROJECT_ID_{0}', upper(matrix.environment))] }}
          TF_VAR_github_repo: ${{ github.repository }}
          TF_VAR_db_password: ${{ secrets[format('DB_PASSWORD_{0}', upper(matrix.environment))] }}
          TF_VAR_firebase_credentials: ${{ secrets[format('FIREBASE_CREDENTIALS_{0}', upper(matrix.environment))] }}

      - name: Post plan to PR
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          ENV: ${{ matrix.environment }}
        with:
          script: |
            const env = process.env.ENV;
            const plan = process.env.PLAN || '(no output)';
            const header = `### Terraform Plan — ${env}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(header));
            const body = `${header}\n\`\`\`hcl\n${plan}\n\`\`\``;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
